name: Docs Catalog

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-catalog.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  jekyll-build:
    name: Jekyll build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Build catalog
        working-directory: docs
        run: bundle exec jekyll build --destination /tmp/myvendor-cms-docs-site
