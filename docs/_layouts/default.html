<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="profile" href="{{ '/catalog/catalog.alps.json' | relative_url }}">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #17202a;
      --muted: #5f6c7b;
      --border: #d9e2ec;
      --panel: #f8fafc;
      --accent: #2251c4;
      --code: #f3f6f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --fg: #e5e7eb;
        --muted: #aeb7c2;
        --border: #374151;
        --panel: #1f2937;
        --accent: #8ab4ff;
        --code: #0f172a;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .site-header, .site-footer {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .site-footer {
      border-top: 1px solid var(--border);
      border-bottom: 0;
      margin-top: 3rem;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
    }
    .brand {
      font-weight: 700;
      text-decoration: none;
      color: var(--fg);
      margin-right: 1rem;
    }
    nav a {
      margin-right: 0.85rem;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }
    nav a:hover, a:hover { text-decoration: underline; }
    main.wrap { padding-top: 2rem; }
    h1, h2, h3 { line-height: 1.25; }
    h1 { font-size: 2.1rem; }
    h2 { margin-top: 2.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
    a { color: var(--accent); }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--code);
      border-radius: 6px;
    }
    code { padding: 0.12rem 0.28rem; }
    pre { padding: 1rem; overflow: auto; border: 1px solid var(--border); }
    pre code { padding: 0; background: transparent; }
    .cards {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      margin: 1.25rem 0;
    }
    .card, .note, .metadata {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      padding: 1rem;
    }
    .card h3 { margin-top: 0; }
    .status {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.05rem 0.55rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .muted { color: var(--muted); }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 0.55rem; text-align: left; vertical-align: top; }
    th { background: var(--panel); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/catalog/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Catalog navigation">
        <a href="{{ '/catalog/' | relative_url }}">Catalog</a>
        <a href="{{ '/llms-catalog/' | relative_url }}">LLM index</a>
        <a href="{{ '/index.html' | relative_url }}">API docs</a>
        <a href="{{ '/alps.html' | relative_url }}">ALPS</a>
        <a href="{{ '/openapi.json' | relative_url }}">OpenAPI</a>
        <a href="{{ '/llms.txt' | relative_url }}">llms.txt</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap muted">
      MyVendor.Cms is an executable BEAR.Sunday catalog. Generated artifacts stay linked, not rewritten.
    </div>
  </footer>
</body>
</html>
