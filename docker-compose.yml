services:
  mysql:
    image: mysql:8.0
    container_name: bear_cms_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bear_cms
    ports:
      - "3306:3306"
    volumes:
      - bear_cms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bear_cms_mysql_data:
